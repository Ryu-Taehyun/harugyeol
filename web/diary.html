<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>내 다이어리 · 하루결</title>
  <link rel="stylesheet" href="/assets/style.css">
  <script src="/assets/main.js" defer></script>
</head>
<body class="workspace" data-page="diary">
  <aside class="rail">
    <a class="brand rail-brand" href="/diary"><span class="brand-mark" aria-hidden="true">◒</span> 하루결</a>
    <nav aria-label="다이어리 메뉴">
      <button type="button" data-view="entries" aria-pressed="true"><span aria-hidden="true">▤</span> 내 다이어리</button>
      <button type="button" data-view="rules" aria-pressed="false"><span aria-hidden="true">◇</span> 계획 규칙</button>
    </nav>
    <div class="account"><span class="avatar" id="avatar" aria-hidden="true"></span><span id="account"></span><button type="button" id="logout">로그아웃</button></div>
  </aside>
  <main class="workspace-content">
    <p id="status" class="status" role="status" hidden></p>
    <section id="entries-view">
      <header class="dashboard-header">
        <div><p id="today-label" class="overline"></p><h1>내 다이어리</h1><p class="muted">계획하고, 실행하고, 하루를 돌아봐요.</p></div>
        <button class="primary" type="button" id="add-entry"><span aria-hidden="true">＋</span> 새 기록</button>
      </header>
      <section class="progress-card" aria-labelledby="progress-title">
        <div><h2 id="progress-title">5일 기록</h2><p id="progress-detail"></p></div>
        <ol class="day-marks" id="day-marks" aria-label="기록한 날짜 수"></ol>
      </section>
      <div class="section-title"><h2>내 기록</h2><span id="entry-count"></span></div>
      <div id="entries"></div>
    </section>
    <section id="rules-view" hidden>
      <header class="dashboard-header"><div><p class="overline">PLAN · DO · SEE</p><h1>계획 규칙</h1><p class="muted">첫 기록을 저장한 날을 1일차로 계산해요. 3일차가 시작되기 전까지 계획 규칙을 한 번 변경할 수 있어요.</p></div></header>
      <div class="rule-card" id="rule-summary"></div>
      <form class="rule-card" id="rule-form" hidden>
        <h2 id="rule-form-heading">최초 규칙</h2>
        <label for="rule-value">계획 규칙</label>
        <textarea id="rule-value" name="value" rows="3" maxlength="300" required placeholder="예: 매일 아침에 오늘 할 일 3개를 적는다."></textarea>
        <div id="reason-wrap" hidden><label for="rule-reason">변경 이유</label><textarea id="rule-reason" name="reason" rows="3" maxlength="500"></textarea></div>
        <p class="error" id="rule-error" role="alert" hidden></p>
        <button class="primary" type="submit" id="save-rule">규칙 저장</button>
      </form>
    </section>
  </main>
  <dialog id="entry-dialog" aria-labelledby="dialog-title">
    <form id="entry-form" class="dialog-panel">
      <div class="section-title"><h2 id="dialog-title">새 기록</h2><button class="ghost close" id="close-dialog" type="button" aria-label="닫기">×</button></div>
      <div class="form-row">
        <div><label for="day">기록 날짜</label><input id="day" name="day" type="date" min="2000-01-01" required></div>
        <div><label for="mood">오늘의 기분</label><select id="mood" name="mood"><option value="">선택 안 함</option><option value="good">좋았어요</option><option value="steady">평온했어요</option><option value="hard">버거웠어요</option></select></div>
      </div>
      <label for="title">제목</label><input id="title" name="title" maxlength="80" placeholder="오늘의 제목" required>
      <label for="plan"><span class="stage plan">PLAN</span> 무엇을 할 계획이었나요?</label><textarea id="plan" name="plan" rows="2" maxlength="2000" required></textarea>
      <label for="action"><span class="stage do">DO</span> 실제로 무엇을 했나요?</label><textarea id="action" name="action" rows="2" maxlength="2000"></textarea>
      <label for="reflection"><span class="stage see">SEE</span> 돌아보니 무엇을 느꼈나요?</label><textarea id="reflection" name="reflection" rows="2" maxlength="2000"></textarea>
      <p class="error" id="entry-error" role="alert" hidden></p>
      <div class="dialog-actions"><button class="ghost" type="button" id="cancel-dialog">취소</button><button class="primary" id="save-entry" type="submit">기록 저장</button></div>
    </form>
  </dialog>
  <dialog id="delete-dialog" aria-labelledby="delete-title">
    <form method="dialog" class="dialog-panel">
      <h2 id="delete-title">기록을 삭제할까요?</h2><p class="muted">삭제한 기록은 복구할 수 없어요.</p>
      <div class="dialog-actions"><button class="ghost" value="cancel" autofocus>취소</button><button class="danger" value="delete">삭제</button></div>
    </form>
  </dialog>
</body>
</html>
