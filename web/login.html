<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="계획하고, 실행하고, 돌아보는 개인 다이어리">
  <title>로그인 · 하루결</title>
  <link rel="stylesheet" href="/assets/style.css">
  <script src="/assets/main.js" defer></script>
</head>
<body class="entry" data-page="login">
  <main class="login-layout">
    <section class="cover">
      <a class="brand cover-brand" href="/"><span class="brand-mark" aria-hidden="true">◒</span> 하루결</a>
      <div class="cover-copy">
        <p class="overline">PLAN · DO · SEE</p>
        <h1>나의 하루에<br>결을 더하다.</h1>
        <p>하루의 계획과 실행, 그리고 회고를 한 곳에.</p>
      </div>
      <div class="cover-art" aria-hidden="true">
        <div class="orbit orbit-one"></div><div class="orbit orbit-two"></div><div class="orbit orbit-three"></div>
        <div class="folio folio-back"></div><div class="folio folio-front"><span></span><i></i><i></i><i></i></div>
      </div>
      <p class="cover-footer">나만의 Plan–Do–See 다이어리</p>
    </section>
    <section class="entry-side" aria-labelledby="auth-heading">
      <div class="entry-inner">
        <div class="auth-switch" aria-label="계정 메뉴">
          <button id="show-login" type="button" aria-pressed="true">로그인</button>
          <button id="show-signup" type="button" aria-pressed="false">회원가입</button>
        </div>
        <h2 id="auth-heading">오늘을 기록해 볼까요?</h2>
        <p class="muted" id="auth-intro">로그인하고 내 다이어리를 열어 보세요.</p>
        <form id="auth-form">
          <label for="username">아이디</label>
          <input id="username" name="username" placeholder="아이디를 입력하세요" autocomplete="username" autocapitalize="none" pattern="[A-Za-z0-9_]{3,24}" minlength="3" maxlength="24" required>
          <label for="password">비밀번호</label>
          <input id="password" name="password" type="password" placeholder="비밀번호를 입력하세요" autocomplete="current-password" minlength="12" maxlength="128" required>
          <p id="password-hint" class="hint" hidden>아이디는 영문, 숫자, 밑줄 3~24자. 비밀번호는 12자 이상.</p>
          <p id="message" class="error" role="alert" hidden></p>
          <button class="primary auth-submit" id="auth-submit" type="submit">로그인</button>
        </form>
        <p class="entry-footer"><span aria-hidden="true">◈</span> 내 기록은 로그인 후에 열 수 있어요.</p>
      </div>
    </section>
  </main>
</body>
</html>
